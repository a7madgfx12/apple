name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned .app
        run: |
          xcodebuild \
            -project PrayerCompanion.xcodeproj \
            -scheme PrayerCompanion \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build \
            SYMROOT=build

      - name: Package as unsigned IPA
        run: |
          mkdir -p Payload
          cp -R "build/Release-iphoneos/PrayerCompanion.app" Payload/
          zip -r PrayerCompanion-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrayerCompanion-unsigned-ipa
          path: PrayerCompanion-unsigned.ipa
