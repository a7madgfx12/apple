name: PrayerCompanion
options:
  bundleIdPrefix: com.prayercompanion
  deploymentTarget:
    iOS: "17.0"
configs:
  Release: release
  Debug: debug
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    DEVELOPMENT_TEAM: ""
    PRODUCT_BUNDLE_IDENTIFIER: com.prayercompanion.app
targets:
  PrayerCompanion:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Core
      - path: Features
      - path: Resources
        buildPhase: resources
    info:
      path: App/Info.plist
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    capabilities:
      - com.apple.BackgroundModes
  PrayerCompanionTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: PrayerCompanion
schemes:
  PrayerCompanion:
    build:
      targets:
        PrayerCompanion: all
        PrayerCompanionTests: [test]
    test:
      targets:
        - PrayerCompanionTests
    archive:
      config: Release
